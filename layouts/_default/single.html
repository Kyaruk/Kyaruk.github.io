{{ define "hero" }}{{ end }}

{{ define "main" }}
  <article class="post post-detail">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <p class="post-meta-info">{{ .Date.Format "2006-01-02" }}{{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}</p>
    </header>
    <div class="post-body">{{ .Content }}</div>
  </article>
{{ end }}
